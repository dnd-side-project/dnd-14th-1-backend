name: Format and Lint

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run Spotless
      id: spotless
      run: |
        set +e
        ./gradlew spotlessCheck > spotless.log 2>&1
        echo "exit_code=$?" >> $GITHUB_OUTPUT
        cat spotless.log

    - name: Comment PR with Spotless results
      if: github.event_name == 'pull_request' && steps.spotless.outputs.exit_code != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = fs.readFileSync('spotless.log', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ❌ Spotless 포맷 위반 발생\n\n\`\`\`\n${log}\n\`\`\`\n\n> \`./gradlew spotlessApply\` 실행 후 다시 푸시해주세요.`
          });

    - name: Fail if Spotless check failed
      if: steps.spotless.outputs.exit_code != '0'
      run: exit 1
