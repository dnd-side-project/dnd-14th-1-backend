spring:
  config:
    import: optional:file:.env[.properties]

server:
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SERVER_SSL_KEYSTORE_PASSWORD:password}
    key-store-type: ${SERVER_SSL_KEYSTORE_TYPE:PKCS12}
    key-alias: ${SERVER_SSL_KEY_ALIAS:tomcat}
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: info
    com.rokyai: debug
